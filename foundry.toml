[profile.default]
src    = "src"
out    = "out"
libs   = ["lib"]
test   = "test"
script = "script"

# Compiler settings
solc_version = "0.8.20"

# Enable the optimizer – very important for gas-efficient production contracts
optimizer        = true
optimizer_runs   = 200   # 200 = good balance between deploy cost and call cost

# Show detailed gas reports in `forge test`
gas_reports = ["MiniCrowdfund"]

# Formatter
[fmt]
line_length   = 100
tab_width     = 4
quote_style   = "double"

# RPC endpoints – override with real URLs or $ENV vars before deploying
[rpc_endpoints]
anvil   = "http://127.0.0.1:8545"
sepolia = "${SEPOLIA_RPC_URL}"

# Block explorer API keys for contract verification
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=11155111" }

